[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "findex"
version = "0.4.0"
description = "Advanced inverted index, search engine, and text processor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "psutil>=7.2.2",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
    "httpx>=0.28.1",
]

[project.scripts]
findex = "findex.cli:app"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pyright>=1.1.0",
    "hypothesis>=6.0.0",
    "ruff>=0.1.0",
]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = [".venv", "build", "dist"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
